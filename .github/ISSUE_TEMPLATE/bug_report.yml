name: Сообщить об ошибке
description: Ошибка или неожиданное поведение Simpltask
title: "[Bug] "
labels:
  - bug
body:
  - type: input
    id: version
    attributes:
      label: Версия Simpltask
      placeholder: Например, 0.4.7
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Версия Windows
      placeholder: Например, Windows 11
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Что произошло
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как повторить
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
